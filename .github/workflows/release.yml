# Instaladores de escritorio para macOS, Windows y Linux.
#
# Se ejecuta al publicar una etiqueta `v*` (por ejemplo `git tag v3.0.1 && git push --tags`)
# o a mano desde la pestaña Actions. Publica un Release en GitHub con:
#   - macOS: BTT Writer_<versión>_universal.dmg (Intel + Apple Silicon)
#   - Windows: BTT Writer_<versión>_x64-setup.exe y BTT Writer_<versión>_x64_en-US.msi
#   - Linux: .deb, .rpm y .AppImage
#   - latest.json + firmas: las apps instaladas detectan la versión nueva y se actualizan solas.
#     Requiere el secreto TAURI_SIGNING_PRIVATE_KEY (clave generada con `tauri signer generate`).
#     Una etiqueta con guion (v3.1.0-beta.1) se publica como prerelease y no actualiza a nadie.
#
# Los paquetes de macOS llevan firma ad hoc (sin cuenta de Apple): la primera vez macOS avisa y hay que
# permitirla en Ajustes del Sistema → Privacidad y seguridad → "Abrir de todos modos".
# Para firmar, añade los secretos APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD y APPLE_TEAM_ID (ver https://v2.tauri.app/distribute/sign/macos/).

name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # .cargo/config.toml apunta a una carpeta de Windows fuera de OneDrive; en CI se usa target/.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Dependencias del frontend
        run: npm ci
        working-directory: apps/desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clave privada del actualizador (secreto del repositorio): firma los paquetes y genera latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "BTT Writer ${{ github.ref_name }}"
          releaseBody: "Instaladores de Windows, macOS y Linux. Las apps instaladas se actualizan solas a esta versión."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Guardar paquetes como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: btt-writer-${{ matrix.platform }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
