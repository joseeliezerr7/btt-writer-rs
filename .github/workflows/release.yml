# Instaladores de escritorio para macOS, Windows y Linux.
#
# Se ejecuta al publicar una etiqueta `v*` (por ejemplo `git tag v3.0.0 && git push --tags`)
# o a mano desde la pestaña Actions. Crea un borrador de Release en GitHub con:
#   - macOS: BTT Writer_3.0.0_universal.dmg (Intel + Apple Silicon)
#   - Windows: BTT Writer_3.0.0_x64-setup.exe y BTT Writer_3.0.0_x64_en-US.msi
#   - Linux: .deb, .rpm y .AppImage
#
# Los paquetes de macOS no van firmados ni notarizados: la primera vez hay que abrir la app con
# clic derecho → Abrir, o quitar la cuarentena con `xattr -dr com.apple.quarantine "/Applications/BTT Writer.app"`.
# Para firmar, añade los secretos APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD y APPLE_TEAM_ID (ver https://v2.tauri.app/distribute/sign/macos/).

name: Instaladores

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      # .cargo/config.toml apunta a una carpeta de Windows fuera de OneDrive; en CI se usa target/.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Dependencias del frontend
        run: npm ci
        working-directory: apps/desktop

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "BTT Writer ${{ github.ref_name }}"
          releaseBody: "Instaladores generados automáticamente."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Guardar paquetes como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: btt-writer-${{ matrix.platform }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
