[workspace]
resolver = "2"
members = ["crates/btt-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "3.0.4"
edition = "2021"
license = "MIT"
authors = ["Solucionestechn <solucionestechn87@gmail.com>"]
repository = "https://github.com/joseeliezerr7/BTT-Writerv2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
bzip2 = { version = "0.5", features = ["static"] }
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
git2 = { version = "0.19", default-features = false, features = ["https"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
sha2 = "0.10"
pulldown-cmark = { version = "0.12", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
