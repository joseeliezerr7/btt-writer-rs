[package]
name = "btt-core"
description = "Núcleo de BTT Writer: proyectos, USFM, recursos, biblioteca y sincronización"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
regex.workspace = true
chrono.workspace = true
rusqlite.workspace = true
zip.workspace = true
tar.workspace = true
bzip2.workspace = true
walkdir.workspace = true
reqwest.workspace = true
uuid.workspace = true
log.workspace = true
sha2.workspace = true
pulldown-cmark.workspace = true

# git2 con HTTPS. En Windows usa WinHTTP (sin OpenSSL).
[target.'cfg(windows)'.dependencies]
git2 = { version = "0.19", default-features = false, features = ["https"] }

# En macOS y Linux, OpenSSL se compila dentro del binario: hace falta para el DMG
# universal (Intel + Apple Silicon) en CI y evita depender de la versión del sistema.
[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
git2 = { version = "0.19", default-features = false, features = ["https", "vendored-openssl"] }

# En Android no hay OpenSSL y compilarlo desde Windows falla: git local sin
# transporte HTTPS (la sincronización con WACS en móvil queda pendiente).
[target.'cfg(target_os = "android")'.dependencies]
git2 = { version = "0.19", default-features = false }

[dev-dependencies]
tempfile.workspace = true
